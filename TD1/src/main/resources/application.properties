spring.application.name=TD1

############# MySQL datasource (edit values below) #############
# Replace the placeholders with your MySQL database name, user and password
spring.datasource.url=jdbc:mysql://localhost:3306/td1_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=td1_user
spring.datasource.password=secret_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server port (optional)
server.port=8080

############# H2 fallback (development) #############
# If you want to use H2 in-memory instead of MySQL, uncomment these lines and comment the MySQL block above.
#spring.datasource.url=jdbc:h2:mem:td1db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
